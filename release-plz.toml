[workspace]
publish = false
git_only = true

git_release_enable = true
changelog_update = true

release_commits = "^(feat|fix|perf|refactor)"

git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

semver_check = false

[[package]]
name = "pakdo-python"
changelog_include = ["pakdo-core"]
